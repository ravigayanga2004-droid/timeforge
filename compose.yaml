services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timeforge}
      POSTGRES_USER: ${POSTGRES_USER:-timeforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-timeforge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-timeforge}
      REDIS_URL: redis://redis:6379/0
      TRUSTED_HOSTS: localhost,127.0.0.1,backend
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["mail:/srv/.mail"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-timeforge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-timeforge}
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.jobs.celery", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  pgdata:
  redisdata:
  mail:
