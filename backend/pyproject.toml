[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "timeforge"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26", "celery[redis]>=5.4,<6",
  "ortools>=9.12,<10", "python-multipart>=0.0.20,<1", "reportlab>=4.3,<5",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "hypothesis>=6.125,<7", "ruff>=0.9,<1", "black>=25,<27", "mypy>=1.15,<2", "types-reportlab"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.black]
line-length = 100
target-version = ["py312"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["alembic/"]
