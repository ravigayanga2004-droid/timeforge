name: Verify TimeForge
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -c backend/constraints.txt -e 'backend[dev]'
      - run: python scripts/manage.py lint
      - run: python -m black --check backend scripts
      - run: python scripts/manage.py typecheck
      - run: python scripts/manage.py test
      - run: python scripts/verify_migrations.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -c backend/constraints.txt -e 'backend[dev]'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_PASSWORD: disposable-ci-test-password
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: frontend/playwright-report
